<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPal Petshop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fffaf2;
            color: #064c5c;
        }

        header {
            background-color: #064c5c;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
        }

        .hero {
            background-color: #f7ead6;
            padding: 80px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
        }

        .hero button {
            background-color: #064c5c;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 5px;
            font-size: 16px;
        }

        .pet-icon {
            font-size: 120px;
        }

        .products {
            text-align: center;
            padding: 40px;
            background-color: white;
        }

        .product-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .product {
            background-color: #f7ead6;
            width: 160px;
            padding: 25px;
            border-radius: 10px;
        }

        .product .icon {
            font-size: 50px;
        }

        footer {
            background-color: #064c5c;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🐾 PETPAL PETSHOP</h1>

        <nav>
            <a href="#">HOME</a>
            <a href="#">PRODUCTS</a>
            <a href="#">ABOUT</a>
            <a href="#">CONTACT</a>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h2>Welcome to PETPAL Petshop</h2>
            <p>Everything your pet needs, all in one place.</p>
            <button>SHOP NOW</button>
        </div>

        <div class="pet-icon">
            🐶 🐱
        </div>
    </section>

    <section class="products">
        <h2>OUR PRODUCTS</h2>

        <div class="product-container">
            <div class="product">
                <div class="icon">🥣</div>
                <h3>PET FOOD</h3>
            </div>

            <div class="product">
                <div class="icon">🦴</div>
                <h3>TOYS</h3>
            </div>

            <div class="product">
                <div class="icon">🐕‍🦺</div>
                <h3>ACCESSORIES</h3>
            </div>

            <div class="product">
                <div class="icon">🧴</div>
                <h3>GROOMING</h3>
            </div>
            <div class="product">
    <div class="icon">🛏️</div>
    <h3>PET BED</h3>
</div>
        </div>
    </section>

    <footer>
        © 2026 PETPAL Petshop. All Rights Reserved.
    </footer>

</body>
</html>
